name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Provider SDKs are imported lazily, so the tests only need the web stack.
      - run: pip install fastapi python-multipart python-dotenv sqlalchemy requests pytest httpx ruff
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stt-benchmark-backend .
      - name: Boot the image and hit the health endpoint
        run: |
          docker run -d --name api -p 8000:8000 stt-benchmark-backend
          for i in $(seq 1 30); do curl -fs localhost:8000/ && exit 0; sleep 1; done
          docker logs api; exit 1
